normalization_notes:
- center_understanding runtime binding is now explicitly normalized instead of falling through the old generic fallback only
- center_understanding keeps a canonical business_family_id and now consumes a dedicated center_understanding material/signal layer; answer-grounding remains on the legacy backbone for compatibility
- required_profiles intentionally stay close to the existing legacy material family to avoid tightening runtime contracts before main-chain consumption is updated

