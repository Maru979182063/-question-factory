<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640">
  <rect width="1180" height="640" fill="#f7f7f2"/>
  <text x="590" y="58" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#202124">难度资产晋级梯度</text>
  <text x="590" y="92" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5f6368">当前没有 formal_weight，不能把 candidate 写成正式权重</text>

  <line x1="140" y1="310" x2="1040" y2="310" stroke="#d0cbc2" stroke-width="10" stroke-linecap="round"/>

  <g>
    <circle cx="170" cy="310" r="42" fill="#d8d1c5"/>
    <text x="170" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">1</text>
    <text x="170" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#202124">diagnostic_only</text>
    <text x="170" y="422" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4a4f55">只解释，不升格</text>
    <rect x="68" y="180" width="204" height="66" rx="18" fill="#edf1ff" stroke="#6b86cf" stroke-width="2"/>
    <text x="170" y="207" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#24457d">topic_intro</text>
    <text x="170" y="231" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#24457d">failed boundary</text>
  </g>

  <g>
    <circle cx="430" cy="310" r="42" fill="#d7a63f"/>
    <text x="430" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">2</text>
    <text x="430" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#202124">candidate_only</text>
    <text x="430" y="422" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4a4f55">有证据，不正式启用</text>
    <rect x="318" y="180" width="224" height="76" rx="18" fill="#fff4d6" stroke="#d7a63f" stroke-width="2"/>
    <text x="430" y="207" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#765200">degree_word</text>
    <text x="430" y="231" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#765200">Spearman 0.3709 / CV gain 0.0133</text>
  </g>

  <g>
    <circle cx="690" cy="310" r="42" fill="#93b899"/>
    <text x="690" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">3</text>
    <text x="690" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#202124">promotable</text>
    <text x="690" y="422" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4a4f55">接近正式，但需人审</text>
    <rect x="592" y="180" width="196" height="66" rx="18" fill="#eef5ef" stroke="#93b899" stroke-width="2"/>
    <text x="690" y="218" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#34633c">当前没有</text>
  </g>

  <g>
    <circle cx="950" cy="310" r="42" fill="#b8b8b8"/>
    <text x="950" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">4</text>
    <text x="950" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#202124">formal_weight</text>
    <text x="950" y="422" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4a4f55">正式权重</text>
    <rect x="852" y="180" width="196" height="66" rx="18" fill="#eeeeee" stroke="#aaaaaa" stroke-width="2"/>
    <text x="950" y="218" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#555">当前没有</text>
  </g>

  <rect x="350" y="505" width="480" height="72" rx="20" fill="#eaf5ef" stroke="#5a9b62" stroke-width="2"/>
  <text x="590" y="533" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#23612d">workbench：handoff-ready experiment tool</text>
  <text x="590" y="558" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#23612d">可复现、可校验、可生成 candidate diff；不是线上成熟平台</text>
</svg>
