  <!-- Section 2 -->
  <text class="ink section-title" x="70" y="965">2. 出题与评审主流程</text>
  <rect class="swim" x="70" y="990" width="1660" height="650" rx="8"/>

  <rect class="card-yellow" x="110" y="1060" width="210" height="105" rx="8"/>
  <text class="ink label" x="132" y="1098">Builder</text>
  <text class="ink small" x="132" y="1128">题型、难度、材料结构</text>
  <text class="ink small" x="132" y="1152">参考母题 / 数量</text>

  <rect class="card-blue" x="385" y="1060" width="230" height="105" rx="8"/>
  <text class="ink label" x="407" y="1098">questions router</text>
  <text class="ink small" x="407" y="1128">POST /generate</text>
  <text class="ink small" x="407" y="1152">generation gate</text>

  <rect class="card-blue" x="680" y="1060" width="250" height="105" rx="8"/>
  <text class="ink label" x="702" y="1098">PromptOrchestrator</text>
  <text class="ink small" x="702" y="1128">input decode / slot resolve</text>
  <text class="ink small" x="702" y="1152">pattern select / prompt build</text>

  <rect class="card-blue" x="995" y="1060" width="260" height="105" rx="8"/>
  <text class="ink label" x="1017" y="1098">QuestionGeneration</text>
  <text class="ink small" x="1017" y="1128">material selection</text>
  <text class="ink small" x="1017" y="1152">prompt render / model call</text>

  <rect class="card-green" x="1320" y="1060" width="300" height="105" rx="8"/>
  <text class="ink label" x="1342" y="1098">MaterialBridgeV2</text>
  <text class="ink small" x="1342" y="1128">/materials/v2/search</text>
  <text class="ink small" x="1342" y="1152">question_ready_context</text>

  <path class="arrow" d="M320 1112 L385 1112"/>
  <path class="arrow" d="M615 1112 L680 1112"/>
  <path class="arrow" d="M930 1112 L995 1112"/>
  <path class="arrow" d="M1255 1112 L1320 1112"/>

  <rect class="card" x="1320" y="1260" width="300" height="130" rx="8"/>
  <text class="ink label" x="1342" y="1298">卡片组合返回</text>
  <text class="ink small" x="1342" y="1328">question_card_id / runtime_binding</text>
  <text class="ink small" x="1342" y="1352">material_card / business_card</text>
  <text class="ink small" x="1342" y="1376">resolved_slots / prompt_extras / validator_contract</text>
  <path class="arrow" d="M1470 1165 L1470 1260"/>

  <rect class="card-purple" x="995" y="1260" width="260" height="130" rx="8"/>
  <text class="ink label" x="1017" y="1298">LLM 生成 / 修复</text>
  <text class="ink small" x="1017" y="1328">structured question draft</text>
  <text class="ink small" x="1017" y="1352">minor edit / question modify</text>
  <text class="ink small" x="1017" y="1376">text modify / distractor patch</text>
  <path class="arrow" d="M1320 1325 L1255 1325"/>

  <rect class="card-red" x="680" y="1260" width="250" height="130" rx="8"/>
  <text class="ink label" x="702" y="1298">校验与评审</text>
  <text class="ink small" x="702" y="1328">QuestionValidator</text>
  <text class="ink small" x="702" y="1352">EvaluationService / LLM judge</text>
  <text class="ink small" x="702" y="1376">auto_failed 或 pending_review</text>
  <path class="arrow" d="M995 1325 L930 1325"/>

  <rect class="muted" x="385" y="1260" width="230" height="130" rx="8"/>
  <text class="ink label" x="407" y="1298">版本化持久化</text>
  <text class="ink small" x="407" y="1328">generation_batches</text>
  <text class="ink small" x="407" y="1352">question_items / versions</text>
  <text class="ink small" x="407" y="1376">review_actions / usage_events</text>
  <path class="arrow" d="M680 1325 L615 1325"/>

  <rect class="card-yellow" x="110" y="1260" width="210" height="130" rx="8"/>
  <text class="ink label" x="132" y="1298">Result 工作页</text>
  <text class="ink small" x="132" y="1328">展示结果、controls</text>
  <text class="ink small" x="132" y="1352">换材、调参、人工编辑</text>
  <text class="ink small" x="132" y="1376">confirm / discard / export</text>
  <path class="arrow" d="M385 1325 L320 1325"/>
  <path class="arrow-soft" d="M215 1260 C190 1210 250 1175 385 1160"/>
  <text class="ink tiny" x="240" y="1218">review action 回流</text>

  <rect class="card-red" x="1110" y="1480" width="470" height="90" rx="8"/>
  <text class="ink label" x="1132" y="1518">当前张力</text>
  <text class="ink body" x="1132" y="1548">题卡已有 validator_contract，但执行口径仍分散在服务、本地补判和前端补丁中。</text>

  <!-- Section 3 -->
  <text class="ink section-title" x="70" y="1720">3. 蒸馏闭环与远程难度实验</text>
  <rect class="swim" x="70" y="1745" width="1660" height="690" rx="8"/>

  <text class="ink label" x="110" y="1805">A. 蒸馏工作台闭环</text>
  <rect class="card" x="110" y="1835" width="220" height="95" rx="8"/>
  <text class="ink body" x="132" y="1872">truth / source question</text>
  <text class="ink small" x="132" y="1898">母题、真题、样本包</text>
  <rect class="card-red" x="385" y="1835" width="220" height="95" rx="8"/>
  <text class="ink body" x="407" y="1872">dataset</text>
  <text class="ink small" x="407" y="1898">train / dev / test</text>
  <rect class="card-red" x="660" y="1835" width="220" height="95" rx="8"/>
  <text class="ink body" x="682" y="1872">session</text>
  <text class="ink small" x="682" y="1898">new_card / tuning modes</text>
  <rect class="card-red" x="935" y="1835" width="220" height="95" rx="8"/>
  <text class="ink body" x="957" y="1872">trial / run</text>
  <text class="ink small" x="957" y="1898">复用生成服务，记录 fit</text>
  <rect class="card-red" x="1210" y="1835" width="220" height="95" rx="8"/>
  <text class="ink body" x="1232" y="1872">human review</text>
  <text class="ink small" x="1232" y="1898">approve / reject / revise</text>
  <rect class="card-red" x="1485" y="1835" width="205" height="95" rx="8"/>
  <text class="ink body" x="1507" y="1872">patch / promote</text>
  <text class="ink small" x="1507" y="1898">candidate bundle</text>
  <path class="arrow" d="M330 1883 L385 1883"/>
  <path class="arrow" d="M605 1883 L660 1883"/>
  <path class="arrow" d="M880 1883 L935 1883"/>
  <path class="arrow" d="M1155 1883 L1210 1883"/>
  <path class="arrow" d="M1430 1883 L1485 1883"/>

  <text class="ink label" x="110" y="2025">B. 叶族难度实验 / 远程执行泳道</text>
  <rect class="card-green" x="110" y="2055" width="240" height="105" rx="8"/>
  <text class="ink body" x="132" y="2092">source docx packs</text>
  <text class="ink small" x="132" y="2118">中心理解 / 程度词 / 语句排序等</text>
  <rect class="card-green" x="405" y="2055" width="240" height="105" rx="8"/>
  <text class="ink body" x="427" y="2092">prepare</text>
  <text class="ink small" x="427" y="2118">hidden truth / label input / schema</text>
  <rect class="card-green" x="700" y="2055" width="240" height="105" rx="8"/>
  <text class="ink body" x="722" y="2092">label + validate</text>
  <text class="ink small" x="722" y="2118">human / subagent labels</text>
  <rect class="card-green" x="995" y="2055" width="250" height="105" rx="8"/>
  <text class="ink body" x="1017" y="2092">fit / analyze</text>
  <text class="ink small" x="1017" y="2118">correlation / CV / ablation</text>
  <rect class="card-green" x="1300" y="2055" width="220" height="105" rx="8"/>
  <text class="ink body" x="1322" y="2092">report + candidate</text>
  <text class="ink small" x="1322" y="2118">charts / YAML / contract</text>
  <path class="arrow" d="M350 2108 L405 2108"/>
  <path class="arrow" d="M645 2108 L700 2108"/>
  <path class="arrow" d="M940 2108 L995 2108"/>
  <path class="arrow" d="M1245 2108 L1300 2108"/>

  <rect class="card-purple" x="405" y="2250" width="420" height="95" rx="8"/>
  <text class="ink body" x="427" y="2287">远程实验执行环境</text>
  <text class="ink small" x="427" y="2313">remote runner / cloud job / long run，执行 stage 并回收 artifacts</text>
  <path class="arrow-soft" d="M615 2250 C700 2195 820 2168 995 2115"/>

  <rect class="card" x="995" y="2250" width="520" height="95" rx="8"/>
  <text class="ink body" x="1017" y="2287">promotion gate</text>
  <text class="ink small" x="1017" y="2313">不自动回写主配置；达到样本、CV、MAE 等门槛后进入人工/agent 审核。</text>
  <path class="arrow-soft" d="M1410 2160 L1410 2250"/>

  <line class="divider" x1="70" y1="2470" x2="1730" y2="2470"/>
  <text class="ink section-title" x="70" y="2520">维护口径</text>
  <text class="ink body" x="70" y="2552">当前真实形态：双服务 + 外置题卡/配置 + 单页工作台 + 蒸馏/实验证据链。后续优先看护规则主权回收，避免业务事实继续散落到页面补丁和服务硬编码中。</text>
</svg>
