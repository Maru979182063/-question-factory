<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2600" viewBox="0 0 1800 2600">
  <defs>
    <style>
      .bg{fill:#f7f5ef}
      .ink{fill:#263238;font-family:'Microsoft YaHei','Noto Sans CJK SC','Arial',sans-serif}
      .title{font-size:36px;font-weight:700}
      .subtitle{font-size:18px;fill:#5f666a}
      .section-title{font-size:26px;font-weight:700}
      .label{font-size:18px;font-weight:700}
      .body{font-size:15px;fill:#39464e}
      .small{font-size:13px;fill:#59656b}
      .tiny{font-size:12px;fill:#607077}
      .card{fill:#fffdf8;stroke:#d9d1c4;stroke-width:2}
      .card-blue{fill:#edf6ff;stroke:#7fb6e8;stroke-width:2}
      .card-green{fill:#eef9f1;stroke:#76bf86;stroke-width:2}
      .card-yellow{fill:#fff8dc;stroke:#d7b85d;stroke-width:2}
      .card-red{fill:#fff0ef;stroke:#dc8a82;stroke-width:2}
      .card-purple{fill:#f4f0ff;stroke:#a892e6;stroke-width:2}
      .swim{fill:#ffffff;stroke:#cfc8bc;stroke-width:2}
      .muted{fill:#f0ede6;stroke:#d4cab8;stroke-width:2}
      .arrow{stroke:#687780;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .arrow-soft{stroke:#9a8d7d;stroke-width:2;fill:none;marker-end:url(#arrowSoft);stroke-dasharray:7 7}
      .divider{stroke:#d7d0c4;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#687780"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a8d7d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="2600"/>
  <text class="ink title" x="70" y="70">项目架构图与流程图</text>
  <text class="ink subtitle" x="70" y="105">题目生产主链 + 材料服务 + 蒸馏闭环 + 远程/叶族难度实验工作台</text>
  <text class="ink tiny" x="70" y="132">来源：docs/system_architecture.md、frontend_structure.md、distill_workbench_service.md、difficulty_experiment_workbench_tooling.md 与核心 FastAPI 入口代码。</text>

  <line class="divider" x1="70" y1="160" x2="1730" y2="160"/>

  <!-- Section 1 -->
  <text class="ink section-title" x="70" y="210">1. 系统架构总览</text>
  <rect class="swim" x="70" y="235" width="1660" height="650" rx="8"/>

  <rect class="card-yellow" x="110" y="285" width="260" height="120" rx="8"/>
  <text class="ink label" x="130" y="323">使用入口</text>
  <text class="ink body" x="130" y="354">/demo 单页工作台</text>
  <text class="ink small" x="130" y="378">builder / loading / result</text>
  <text class="ink body" x="130" y="402">/demo/distill 蒸馏工作台</text>

  <rect class="card-blue" x="440" y="260" width="420" height="250" rx="8"/>
  <text class="ink label" x="465" y="298">prompt_skeleton_service</text>
  <text class="ink body" x="465" y="330">出题、评审、蒸馏编排</text>
  <text class="ink small" x="465" y="360">routers: questions / review / distill / demo</text>
  <text class="ink small" x="465" y="385">services: orchestrator / generation / review</text>
  <text class="ink small" x="465" y="410">distill_workbench / validator / evaluator</text>
  <rect class="muted" x="465" y="435" width="360" height="45" rx="6"/>
  <text class="ink small" x="485" y="463">SQLite: batches / items / versions / actions / distill</text>

  <rect class="card-green" x="940" y="260" width="350" height="250" rx="8"/>
  <text class="ink label" x="965" y="298">passage_service</text>
  <text class="ink body" x="965" y="330">材料加工、治理、V2 检索</text>
  <text class="ink small" x="965" y="360">articles / crawl / process</text>
  <text class="ink small" x="965" y="385">tagging / material governance</text>
  <text class="ink small" x="965" y="410">/materials/v2/search</text>
  <rect class="muted" x="965" y="435" width="290" height="45" rx="6"/>
  <text class="ink small" x="985" y="463">SQLite: articles / spans / material pool</text>

  <rect class="card-purple" x="1380" y="260" width="300" height="250" rx="8"/>
  <text class="ink label" x="1405" y="298">模型链路</text>
  <text class="ink body" x="1405" y="330">generation LLM</text>
  <text class="ink body" x="1405" y="360">material refinement LLM</text>
  <text class="ink body" x="1405" y="390">evaluation judge LLM</text>
  <text class="ink small" x="1405" y="430">生成、修复、材料轻修、评审判断</text>

  <rect class="card" x="190" y="590" width="390" height="210" rx="8"/>
  <text class="ink label" x="215" y="628">外置卡片与配置</text>
  <text class="ink body" x="215" y="660">card_specs</text>
  <text class="ink small" x="215" y="684">question_cards / material_cards / signal_layers</text>
  <text class="ink small" x="215" y="708">business_feature_slots / validator_contract</text>
  <text class="ink body" x="215" y="742">prompt configs / runtime / prompt_assets</text>
  <text class="ink small" x="215" y="766">configs/types / prompt_templates / llm routing</text>

  <rect class="card-red" x="690" y="590" width="390" height="210" rx="8"/>
  <text class="ink label" x="715" y="628">蒸馏与难度实验</text>
  <text class="ink body" x="715" y="660">DistillWorkbench</text>
  <text class="ink small" x="715" y="684">dataset / session / run / review / patch / promotion</text>
  <text class="ink body" x="715" y="724">difficulty_experiment_workbench.py</text>
  <text class="ink small" x="715" y="748">hidden truth / labels / CV / ablation / report</text>
  <text class="ink small" x="715" y="772">远程实验 runner 可接入长任务执行</text>

  <rect class="card" x="1190" y="590" width="350" height="210" rx="8"/>
  <text class="ink label" x="1215" y="628">证据与交付物</text>
  <text class="ink body" x="1215" y="660">reports / docs / candidate_diffs</text>
  <text class="ink small" x="1215" y="688">fit reports / charts / handoff bundle</text>
  <text class="ink small" x="1215" y="716">promotion gate 后才进入人工合并</text>
  <text class="ink body" x="1215" y="756">logs / runtime events</text>

  <path class="arrow" d="M370 345 L440 345"/>
  <path class="arrow" d="M860 370 L940 370"/>
