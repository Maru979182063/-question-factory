<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450">
  <defs>
    <style>
      .bg{fill:#f7f4ec}
      .ink{fill:#25313a;font-family:'Microsoft YaHei','Noto Sans CJK SC','Arial',sans-serif}
      .title{font-size:36px;font-weight:700}
      .sub{font-size:16px;fill:#65717a}
      .panel-title{font-size:24px;font-weight:700}
      .step-title{font-size:17px;font-weight:700}
      .body{font-size:13px;fill:#46525a}
      .panel{fill:#fffdf8;stroke:#d7cebf;stroke-width:2}
      .blue{fill:#eaf4ff;stroke:#6da9dc;stroke-width:2}
      .green{fill:#edf8ee;stroke:#70b87f;stroke-width:2}
      .red{fill:#fff0ef;stroke:#d8847d;stroke-width:2}
      .purple{fill:#f5f0ff;stroke:#9d88dc;stroke-width:2}
      .arrow{stroke:#65737c;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#9b8172;stroke-width:2.4;fill:none;marker-end:url(#loopArrow);stroke-dasharray:7 7}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#65737c"/>
    </marker>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9b8172"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1450"/>
  <text class="ink title" x="70" y="70">四个服务流程图</text>
  <text class="ink sub" x="70" y="104">每个服务一条主线，只保留一个关键回流点。细节后续再单独展开。</text>

  <!-- Panel 1 -->
  <rect class="panel" x="70" y="145" width="800" height="565" rx="12"/>
  <text class="ink panel-title" x="105" y="188">一、生题服务流程</text>
  <rect class="blue" x="120" y="225" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="145" y="255">工作台提交出题请求</text>
  <text class="ink body" x="145" y="278">题型、难度、参考母题、生成数量</text>
  <rect class="blue" x="465" y="225" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="490" y="255">解析请求并绑定题卡</text>
  <text class="ink body" x="490" y="278">解 slot、选 pattern、组 prompt</text>
  <rect class="blue" x="465" y="335" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="490" y="365">向材料服务取材</text>
  <text class="ink body" x="490" y="388">获得可生题上下文</text>
  <rect class="blue" x="120" y="335" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="145" y="365">调用模型生成</text>
  <text class="ink body" x="145" y="388">题目、答案、解析结构化输出</text>
  <rect class="blue" x="120" y="445" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="145" y="475">校验与评审判断</text>
  <text class="ink body" x="145" y="498">自动校验 + LLM judge</text>
  <rect class="blue" x="465" y="445" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="490" y="475">保存并返回工作台</text>
  <text class="ink body" x="490" y="498">批次、题目版本、运行快照</text>
  <path class="arrow" d="M405 260 L465 260"/>
  <path class="arrow" d="M607 295 L607 335"/>
  <path class="arrow" d="M465 370 L405 370"/>
  <path class="arrow" d="M262 405 L262 445"/>
  <path class="arrow" d="M405 480 L465 480"/>
  <path class="loop" d="M607 515 C620 630 160 625 160 295"/>
  <text class="ink body" x="215" y="638">回流：调参 / 换材 / 手工编辑后重新进入生成链路</text>

  <!-- Panel 2 -->
  <rect class="panel" x="930" y="145" width="800" height="565" rx="12"/>
  <text class="ink panel-title" x="965" y="188">二、材料服务流程</text>
  <rect class="green" x="980" y="225" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1005" y="255">文章来源 / 外部检索</text>
  <text class="ink body" x="1005" y="278">固定来源、外部 fallback、人工材料</text>
  <rect class="green" x="1325" y="225" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1350" y="255">入库与清洗</text>
  <text class="ink body" x="1350" y="278">去重、清洗、基础文章记录</text>
  <rect class="green" x="1325" y="335" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1350" y="365">切片、tag、候选构造</text>
  <text class="ink body" x="1350" y="388">段落、句群、功能槽候选</text>
  <rect class="green" x="980" y="335" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1005" y="365">材料卡异步收路</text>
  <text class="ink body" x="1005" y="388">预计算 V2 索引，沉淀候选</text>
  <rect class="green" x="980" y="445" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1005" y="475">材料 V2 检索</text>
  <text class="ink body" x="1005" y="498">按题卡、材料卡、业务卡筛选</text>
  <rect class="green" x="1325" y="445" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1350" y="475">返回可生题上下文</text>
  <text class="ink body" x="1350" y="498">question_ready_context</text>
  <path class="arrow" d="M1265 260 L1325 260"/>
  <path class="arrow" d="M1467 295 L1467 335"/>
  <path class="arrow" d="M1325 370 L1265 370"/>
  <path class="arrow" d="M1122 405 L1122 445"/>
  <path class="arrow" d="M1265 480 L1325 480"/>
  <path class="loop" d="M1467 515 C1480 625 1000 625 1000 405"/>
  <text class="ink body" x="1075" y="638">回流：使用反馈、冷却、灰度、晋升后重新收路</text>

  <!-- Panel 3 -->
  <rect class="panel" x="70" y="770" width="800" height="565" rx="12"/>
  <text class="ink panel-title" x="105" y="813">三、蒸馏服务流程</text>
  <rect class="red" x="120" y="850" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="145" y="880">真题样本集</text>
  <text class="ink body" x="145" y="903">train / dev / test</text>
  <rect class="red" x="465" y="850" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="490" y="880">创建蒸馏会话</text>
  <text class="ink body" x="490" y="903">绑定题卡、目标、基线请求</text>
  <rect class="red" x="465" y="960" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="490" y="990">发起试跑</text>
  <text class="ink body" x="490" y="1013">为样本组装生成请求</text>
  <rect class="red" x="120" y="960" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="145" y="990">复用生题服务</text>
  <text class="ink body" x="145" y="1013">生成题目并记录样本结果</text>
  <rect class="red" x="120" y="1070" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="145" y="1100">生成拟合摘要</text>
  <text class="ink body" x="145" y="1123">答案、题干、解析、材料相似度</text>
  <rect class="red" x="465" y="1070" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="490" y="1100">人审与候选改动包</text>
  <text class="ink body" x="490" y="1123">patch / promotion bundle</text>
  <path class="arrow" d="M405 885 L465 885"/>
  <path class="arrow" d="M607 920 L607 960"/>
  <path class="arrow" d="M465 995 L405 995"/>
  <path class="arrow" d="M262 1030 L262 1070"/>
  <path class="arrow" d="M405 1105 L465 1105"/>
  <path class="loop" d="M607 1140 C610 1260 215 1260 215 1140"/>
  <text class="ink body" x="230" y="1263">回流：人审后把候选改动沉淀回题卡、prompt 或材料策略</text>

  <!-- Panel 4 -->
  <rect class="panel" x="930" y="770" width="800" height="565" rx="12"/>
  <text class="ink panel-title" x="965" y="813">四、难度实验工具流程</text>
  <rect class="purple" x="980" y="850" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1005" y="880">实验配置 + 真题包</text>
  <text class="ink body" x="1005" y="903">叶族、样本来源、promotion gate</text>
  <rect class="purple" x="1325" y="850" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1350" y="880">准备样本</text>
  <text class="ink body" x="1350" y="903">hidden truth / label input / schema</text>
  <rect class="purple" x="1325" y="960" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1350" y="990">标注回收与校验</text>
  <text class="ink body" x="1350" y="1013">人工或子任务标注，检查对齐</text>
  <rect class="purple" x="980" y="960" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1005" y="990">拟合与分析</text>
  <text class="ink body" x="1005" y="1013">相关性、CV、消融、分箱</text>
  <rect class="purple" x="980" y="1070" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1005" y="1100">报告与图表</text>
  <text class="ink body" x="1005" y="1123">实验报告、曲线、误差分析</text>
  <rect class="purple" x="1325" y="1070" width="285" height="70" rx="8"/>
  <text class="ink step-title" x="1350" y="1100">候选难度资产</text>
  <text class="ink body" x="1350" y="1123">prompt assets / contract / YAML</text>
  <path class="arrow" d="M1265 885 L1325 885"/>
  <path class="arrow" d="M1467 920 L1467 960"/>
  <path class="arrow" d="M1325 995 L1265 995"/>
  <path class="arrow" d="M1122 1030 L1122 1070"/>
  <path class="arrow" d="M1265 1105 L1325 1105"/>
  <path class="loop" d="M1467 1140 C1465 1260 1080 1260 1080 1140"/>
  <text class="ink body" x="1090" y="1263">回流：通过 promotion gate 后进入规则资产层，仍需人工确认</text>
</svg>
