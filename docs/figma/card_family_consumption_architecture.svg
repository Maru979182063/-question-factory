<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1220" viewBox="0 0 1450 1220">
  <defs>
    <style>
      .bg{fill:#f7f4ec}
      .ink{fill:#25313a;font-family:'Microsoft YaHei','Noto Sans CJK SC','Arial',sans-serif}
      .title{font-size:36px;font-weight:700}
      .sub{font-size:16px;fill:#65717a}
      .layer-title{font-size:24px;font-weight:700}
      .item-title{font-size:17px;font-weight:700}
      .body{font-size:14px;fill:#46525a}
      .small{font-size:12px;fill:#66717a}
      .layer{fill:#fffdf8;stroke:#d7cebf;stroke-width:2}
      .service{fill:#eaf4ff;stroke:#6da9dc;stroke-width:2}
      .runtime{fill:#eef1f3;stroke:#96a1a8;stroke-width:2}
      .mother{fill:#fff7db;stroke:#d2b65c;stroke-width:2}
      .child{fill:#fff0ef;stroke:#d8847d;stroke-width:2}
      .leaf{fill:#f5f0ff;stroke:#9d88dc;stroke-width:2}
      .asset{fill:#edf8ee;stroke:#70b87f;stroke-width:2}
      .evidence{fill:#ffffff;stroke:#bda891;stroke-width:2}
      .arrow{stroke:#65737c;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#9b8172;stroke-width:3;fill:none;marker-end:url(#softArrow);stroke-dasharray:8 8}
      .label-bg{fill:#f7f4ec}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#65737c"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9b8172"/>
    </marker>
  </defs>

  <rect class="bg" width="1450" height="1220"/>
  <text class="ink title" x="70" y="72">母族-子族-叶族消费架构图</text>
  <text class="ink sub" x="70" y="106">按你的真实消费路径看：服务先消费运行口径，再落到母族、子族、叶族，最后由资产承载。</text>

  <!-- Service consumption -->
  <rect class="layer" x="120" y="145" width="870" height="105" rx="12"/>
  <text class="ink layer-title" x="150" y="187">服务消费层</text>
  <rect class="service" x="355" y="170" width="135" height="54" rx="8"/>
  <text class="ink body" x="382" y="202">材料服务</text>
  <rect class="service" x="520" y="170" width="135" height="54" rx="8"/>
  <text class="ink body" x="547" y="202">生题服务</text>
  <rect class="service" x="685" y="170" width="135" height="54" rx="8"/>
  <text class="ink body" x="712" y="202">蒸馏服务</text>
  <rect class="service" x="850" y="170" width="110" height="54" rx="8"/>
  <text class="ink body" x="870" y="202">难度实验</text>

  <!-- Runtime -->
  <rect class="layer" x="120" y="310" width="870" height="105" rx="12"/>
  <text class="ink layer-title" x="150" y="352">运行消费口径</text>
  <rect class="runtime" x="340" y="335" width="120" height="52" rx="8"/>
  <text class="ink body" x="368" y="366">取材</text>
  <rect class="runtime" x="485" y="335" width="120" height="52" rx="8"/>
  <text class="ink body" x="508" y="366">组 prompt</text>
  <rect class="runtime" x="630" y="335" width="120" height="52" rx="8"/>
  <text class="ink body" x="660" y="366">校验</text>
  <rect class="runtime" x="775" y="335" width="155" height="52" rx="8"/>
  <text class="ink body" x="802" y="366">蒸馏 / 实验</text>

  <!-- Mother -->
  <rect class="layer" x="120" y="475" width="870" height="130" rx="12"/>
  <text class="ink layer-title" x="150" y="517">母族层</text>
  <rect class="mother" x="190" y="540" width="130" height="42" rx="8"/>
  <text class="ink body" x="219" y="567">中心理解</text>
  <rect class="mother" x="345" y="540" width="130" height="42" rx="8"/>
  <text class="ink body" x="374" y="567">语句填空</text>
  <rect class="mother" x="500" y="540" width="130" height="42" rx="8"/>
  <text class="ink body" x="529" y="567">语句排序</text>
  <rect class="mother" x="655" y="540" width="105" height="42" rx="8"/>
  <text class="ink body" x="690" y="567">接语</text>
  <rect class="mother" x="785" y="540" width="130" height="42" rx="8"/>
  <text class="ink body" x="814" y="567">标题选择</text>

  <!-- Child -->
  <rect class="layer" x="120" y="665" width="870" height="150" rx="12"/>
  <text class="ink layer-title" x="150" y="707">子族层</text>
  <rect class="child" x="175" y="735" width="200" height="54" rx="8"/>
  <text class="ink item-title" x="200" y="758">中心理解子族</text>
  <text class="ink small" x="200" y="779">关系词 / 特殊问法 / 分述句特征</text>
  <rect class="child" x="410" y="735" width="200" height="54" rx="8"/>
  <text class="ink item-title" x="435" y="758">语句填空子族</text>
  <text class="ink small" x="435" y="779">开头 / 中间 / 结尾</text>
  <rect class="child" x="645" y="735" width="250" height="54" rx="8"/>
  <text class="ink item-title" x="670" y="758">语句排序子族</text>
  <text class="ink small" x="670" y="779">首句 / 捆绑 / 顺序 / 尾句</text>

  <!-- Leaf -->
  <rect class="layer" x="120" y="875" width="870" height="165" rx="12"/>
  <text class="ink layer-title" x="150" y="917">叶族层</text>
  <rect class="leaf" x="170" y="945" width="180" height="66" rx="8"/>
  <text class="ink item-title" x="195" y="970">中心理解叶族</text>
  <text class="ink small" x="195" y="991">程度词、主题词、转折、并列、对策等</text>
  <rect class="leaf" x="385" y="945" width="230" height="66" rx="8"/>
  <text class="ink item-title" x="410" y="970">语句填空叶族</text>
  <text class="ink small" x="410" y="991">段首总起、话题引入、中间承上启下、尾句总结等</text>
  <rect class="leaf" x="650" y="945" width="255" height="66" rx="8"/>
  <text class="ink item-title" x="675" y="970">语句排序叶族</text>
  <text class="ink small" x="675" y="991">六句角色链、首句合法性、确定捆绑、时间/行动顺序等</text>

  <!-- Assets -->
  <rect class="layer" x="120" y="1085" width="870" height="85" rx="12"/>
  <text class="ink layer-title" x="150" y="1135">资产承载层</text>
  <text class="ink body" x="355" y="1135">题卡定义 / 材料卡定义 / 信号层 / slot 投影 / 蒸馏映射 / 难度资产</text>

  <!-- Main arrows -->
  <path class="arrow" d="M555 250 L555 310"/>
  <path class="arrow" d="M555 415 L555 475"/>
  <path class="arrow" d="M555 605 L555 665"/>
  <path class="arrow" d="M555 815 L555 875"/>
  <path class="arrow" d="M555 1040 L555 1085"/>

  <rect class="label-bg" x="490" y="275" width="130" height="24" rx="4"/>
  <text class="ink small" x="505" y="292">服务消费运行口径</text>
  <rect class="label-bg" x="495" y="440" width="120" height="24" rx="4"/>
  <text class="ink small" x="512" y="457">运行落到母族</text>
  <rect class="label-bg" x="490" y="630" width="130" height="24" rx="4"/>
  <text class="ink small" x="507" y="647">母族分到子族</text>
  <rect class="label-bg" x="490" y="840" width="130" height="24" rx="4"/>
  <text class="ink small" x="507" y="857">子族细化叶族</text>
  <rect class="label-bg" x="485" y="1050" width="140" height="24" rx="4"/>
  <text class="ink small" x="502" y="1067">叶族由资产承载</text>

  <!-- Evidence side -->
  <rect class="layer" x="1060" y="665" width="285" height="375" rx="12"/>
  <text class="ink layer-title" x="1090" y="707">证据与回流层</text>
  <rect class="evidence" x="1095" y="740" width="215" height="50" rx="8"/>
  <text class="ink body" x="1120" y="770">真题样本 / 蒸馏试跑</text>
  <rect class="evidence" x="1095" y="815" width="215" height="50" rx="8"/>
  <text class="ink body" x="1120" y="845">难度实验 / 标注拟合</text>
  <rect class="evidence" x="1095" y="890" width="215" height="50" rx="8"/>
  <text class="ink body" x="1120" y="920">人工审核 / 候选改动包</text>
  <text class="ink small" x="1095" y="982">回流只修正叶族理解和资产承载，</text>
  <text class="ink small" x="1095" y="1004">不应该绕过母族-子族-叶族结构。</text>

  <path class="soft" d="M1060 915 L990 980"/>
  <path class="soft" d="M1060 940 C1025 1015 1020 1105 990 1128"/>

  <text class="ink small" x="70" y="1200">说明：这张按“消费路径”画；文件名只是承载，不作为主概念。后续可以继续单独画某个母族的子族-叶族树。</text>
</svg>
