<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660">
  <rect width="1180" height="660" fill="#f6f3ec"/>
  <text x="590" y="58" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#202124">难度资产三层图</text>
  <text x="590" y="92" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5f6368">不是正式难度总线，而是叶族证据链封板包</text>

  <rect x="70" y="150" width="320" height="340" rx="28" fill="#fffaf0" stroke="#d8a441" stroke-width="3"/>
  <circle cx="112" cy="195" r="20" fill="#d8a441"/>
  <text x="112" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
  <text x="150" y="199" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#202124">candidate 成果</text>
  <text x="100" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#7a5200">center_understanding / degree_word</text>
  <text x="100" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">主轴：local_detail_distractor_strength</text>
  <text x="100" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">证据：相关性 + CV + 分箱 + YAML</text>
  <text x="100" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">状态：candidate_only</text>
  <rect x="100" y="405" width="230" height="46" rx="23" fill="#f3d38a"/>
  <text x="215" y="434" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#3f2b00">有成果，但不正式启用</text>

  <rect x="430" y="150" width="320" height="340" rx="28" fill="#f3f7ff" stroke="#5b7fc7" stroke-width="3"/>
  <circle cx="472" cy="195" r="20" fill="#5b7fc7"/>
  <text x="472" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
  <text x="510" y="199" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#202124">failed boundary</text>
  <text x="460" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#24457d">sentence_fill / 话题引入</text>
  <text x="460" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">结论：弱信号未过晋级门槛</text>
  <text x="460" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">价值：防止误升格与过度包装</text>
  <text x="460" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">状态：diagnostic reference</text>
  <rect x="460" y="405" width="230" height="46" rx="23" fill="#c9d8ff"/>
  <text x="575" y="434" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#173763">失败不是废料</text>

  <rect x="790" y="150" width="320" height="340" rx="28" fill="#eff8f1" stroke="#5a9b62" stroke-width="3"/>
  <circle cx="832" cy="195" r="20" fill="#5a9b62"/>
  <text x="832" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
  <text x="870" y="199" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#202124">workbench</text>
  <text x="820" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#22612d">difficulty_experiment_workbench</text>
  <text x="820" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">能力：status / validate / analyze / report</text>
  <text x="820" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">能力：candidate-diff，不自动回写</text>
  <text x="820" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#202124">状态：handoff-ready tool</text>
  <rect x="820" y="405" width="230" height="46" rx="23" fill="#c9e8ce"/>
  <text x="935" y="434" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f5528">可复现，不是线上平台</text>

  <path d="M390 320 C410 320 410 320 430 320" stroke="#b6aca0" stroke-width="4" fill="none"/>
  <path d="M750 320 C770 320 770 320 790 320" stroke="#b6aca0" stroke-width="4" fill="none"/>
  <text x="590" y="565" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#202124">封板口径：一个 candidate 成果 + 一个 failed boundary + 一套可交接工作台</text>
</svg>
